<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SVG Floral Garland</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="garland-wrapper">
    <div class="halo-bg"></div>
    <svg class="garland-svg" viewBox="0 0 1000 60" xmlns="http://www.w3.org/2000/svg">

      <!-- Fleur 1 -->
      <g class="flower" transform="translate(30, 20)">
        <g class="flower-inner">
          <g class="petals" fill="#f6F4CD" stroke="#2596be" stroke-width="2">
            <path d="M50 50 C40 30 45 10 50 10 C55 10 60 30 50 50 Z"></path>
            <path d="M50 50 C40 30 45 10 50 10 C55 10 60 30 50 50 Z" transform="rotate(72 50 50)"></path>
            <path d="M50 50 C40 30 45 10 50 10 C55 10 60 30 50 50 Z" transform="rotate(144 50 50)"></path>
            <path d="M50 50 C40 30 45 10 50 10 C55 10 60 30 50 50 Z" transform="rotate(216 50 50)"></path>
            <path d="M50 50 C40 30 45 10 50 10 C55 10 60 30 50 50 Z" transform="rotate(288 50 50)"></path>
          </g>
          <circle class="center" cx="50" cy="50" r="7" fill="#f6C4CD" stroke="#2596BE" stroke-width="1.5"></circle>
        </g>
      </g>

      <!-- Fleur 2 -->
      <g class="flower" transform="translate(200, 10)">
        <g class="flower-inner">
          <g class="petals" fill="#D36B87" stroke="#8a5aab" stroke-width="2">
            <path d="M50 50 C40 30 45 10 50 10 C55 10 60 30 50 50 Z"></path>
            <path d="M50 50 C40 30 45 10 50 10 C55 10 60 30 50 50 Z" transform="rotate(72 50 50)"></path>
            <path d="M50 50 C40 30 45 10 50 10 C55 10 60 30 50 50 Z" transform="rotate(144 50 50)"></path>
            <path d="M50 50 C40 30 45 10 50 10 C55 10 60 30 50 50 Z" transform="rotate(216 50 50)"></path>
            <path d="M50 50 C40 30 45 10 50 10 C55 10 60 30 50 50 Z" transform="rotate(288 50 50)"></path>
          </g>
          <circle class="center" cx="50" cy="50" r="7" fill="#884C52" stroke="#8a5aab" stroke-width="1.5"></circle>
        </g>
      </g>

      <!-- Fleur 3 -->
      <g class="flower" transform="translate(360, 0)">
        <g class="flower-inner">
          <g class="petals" fill="#884C52" stroke="#8a5aab" stroke-width="2">
            <path d="M50 50 C40 30 45 10 50 10 C55 10 60 30 50 50 Z"></path>
            <path d="M50 50 C40 30 45 10 50 10 C55 10 60 30 50 50 Z" transform="rotate(72 50 50)"></path>
            <path d="M50 50 C40 30 45 10 50 10 C55 10 60 30 50 50 Z" transform="rotate(144 50 50)"></path>

            <path d="M50 50 C40 30 45 10 50 10 C55 10 60 30 50 50 Z" transform="rotate(288 50 50)"></path>
          </g>
          <circle class="center" cx="50" cy="50" r="7" fill="#B97685" stroke="#8a5aab" stroke-width="1.5"></circle>
        </g>
      </g>

      <!-- Fleur 4 -->
      <g class="flower" transform="translate(520, 15)">
        <g class="flower-inner">
          <g class="petals" fill="#B97685" stroke="#8a5aab" stroke-width="2">
            <path d="M50 50 C40 30 45 10 50 10 C55 10 60 30 50 50 Z"></path>
            <path d="M50 50 C40 30 45 10 50 10 C55 10 60 30 50 50 Z" transform="rotate(72 50 50)"></path>
            <path d="M50 50 C40 30 45 10 50 10 C55 10 60 30 50 50 Z" transform="rotate(144 50 50)"></path>
            <path d="M50 50 C40 30 45 10 50 10 C55 10 60 30 50 50 Z" transform="rotate(216 50 50)"></path>
            <path d="M50 50 C40 30 45 10 50 10 C55 10 60 30 50 50 Z" transform="rotate(288 50 50)"></path>
          </g>
          <circle class="center" cx="50" cy="50" r="7" fill="#ffe066" stroke="#8a5aab" stroke-width="1.5"></circle>
        </g>
      </g>

      <!-- Fleur 5 -->
      <g class="flower" transform="translate(690, -5)">
        <g class="flower-inner">
          <g class="petals" fill="#ffd1dc" stroke="#8a5aab" stroke-width="2">
            <path d="M50 50 C40 30 45 10 50 10 C55 10 60 30 50 50 Z"></path>
            <path d="M50 50 C40 30 45 10 50 10 C55 10 60 30 50 50 Z" transform="rotate(72 50 50)"></path>
            <path d="M50 50 C40 30 45 10 50 10 C55 10 60 30 50 50 Z" transform="rotate(144 50 50)"></path>
            <path d="M50 50 C40 30 45 10 50 10 C55 10 60 30 50 50 Z" transform="rotate(216 50 50)"></path>
            <path d="M50 50 C40 30 45 10 50 10 C55 10 60 30 50 50 Z" transform="rotate(288 50 50)"></path>
          </g>
          <circle class="center" cx="50" cy="50" r="7" fill="#ffe066" stroke="#8a5aab" stroke-width="1.5"></circle>
        </g>

      <!-- Fleur 6 -->
      <g class="flower" transform="translate(880,-15)">
        <g class="flower-inner">
          <g class="petals" fill="#f0b6C2" stroke="#8a5aab" stroke-width="2">

            <path d="M50 50 C40 30 45 10 50 10 C55 10 60 30 50 50 Z" transform="rotate(72 50 50)"></path>
            <path d="M50 50 C40 30 45 10 50 10 C55 10 60 30 50 50 Z" transform="rotate(144 50 50)"></path>
            <path d="M50 50 C40 30 45 10 50 10 C55 10 60 30 50 50 Z" transform="rotate(216 50 50)"></path>
            <path d="M50 50 C40 30 45 10 50 10 C55 10 60 30 50 50 Z" transform="rotate(288 50 50)"></path>
          </g>
          <circle class="center" cx="50" cy="50" r="7" fill="#ffe066" stroke="#8a5aab" stroke-width="1.5"></circle>
        </g>
      </g>

    </svg>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
